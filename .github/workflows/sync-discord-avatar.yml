name: Sync Discord avatar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-discord-avatar.yml"
      - "scripts/sync-discord-avatar.mjs"

permissions:
  contents: write

jobs:
  sync-avatar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current Discord avatar
        run: node scripts/sync-discord-avatar.mjs
      - name: Commit changed avatar
        run: |
          if git diff --quiet -- assets/volibot-avatar.png index.html terms/index.html privacy/index.html; then
            echo "Avatar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/volibot-avatar.png index.html terms/index.html privacy/index.html
          git commit -m "Sync Discord avatar"
          git push
